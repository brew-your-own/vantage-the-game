<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Vantage</title>
    <style>
      html, body { margin: 0; height: 100%; background: #000; color: #ddd; font-family: monospace; overflow: hidden; }
      #app { width: 100%; height: 100%; }
      #crosshair { position: fixed; left: 50%; top: 50%; width: 16px; height: 16px; margin: -8px 0 0 -8px; pointer-events: none; }
      #crosshair::before, #crosshair::after { content: ''; position: absolute; background: #e8ecff; box-shadow: 0 0 2px #000; }
      #crosshair::before { left: 7px; top: 0; width: 2px; height: 16px; }
      #crosshair::after { top: 7px; left: 0; height: 2px; width: 16px; }
      #energy { position: fixed; left: 12px; top: 10px; font-size: 14px; color: #ffe27a; text-shadow: 0 0 4px #000; pointer-events: none; }
      #energy .pips { letter-spacing: 1px; color: #ffd24a; }
      #message { position: fixed; left: 50%; top: 58%; transform: translateX(-50%); font-size: 15px; color: #c8ffd0; text-shadow: 0 0 4px #000; transition: opacity 0.4s; opacity: 0; pointer-events: none; }
      #message.error { color: #ff9a9a; }
      #taunt { position: fixed; left: 50%; bottom: 72px; transform: translateX(-50%); max-width: min(90vw, 640px); text-align: center; font-size: 17px; font-style: italic; color: #ffd27a; text-shadow: 0 0 6px #000, 0 0 2px #000; transition: opacity 0.6s; opacity: 0; pointer-events: none; }
      #beam { position: fixed; right: 12px; top: 10px; font-size: 14px; color: #c8d0ff; text-shadow: 0 0 4px #000; pointer-events: none; }
      #beam.safe { color: #7fa0c8; }
      #beam.warn { color: #ffb347; font-weight: bold; }
      #beam.lit { color: #ff5c5c; font-weight: bold; }
      #lit { position: fixed; inset: 0; pointer-events: none; opacity: 0; transition: opacity 0.15s;
             background: radial-gradient(ellipse at center, rgba(255,200,80,0) 45%, rgba(255,120,40,0.55) 100%); }
      #end { position: fixed; inset: 0; display: none; flex-direction: column; align-items: center; justify-content: center;
             background: rgba(5,6,15,0.82); color: #e8ecff; text-align: center; }
      #end h1 { font-size: 28px; letter-spacing: 4px; color: #ff9a6a; margin: 0 0 12px; }
      #end p { margin: 4px; color: #b8c0e8; }
      #relays { position: fixed; right: 12px; top: 30px; font-size: 13px; color: #c8b070; text-shadow: 0 0 4px #000; pointer-events: none; }
      #relays .marks { color: #ffd36a; letter-spacing: 2px; }
      #relays.over { color: #a08868; }
      #end h1.won { color: #ffd36a; }
      #end .stars { font-size: 34px; letter-spacing: 6px; }
      .on { color: #ffd36a; } .off { color: #4a4f6a; }
      #menu { position: fixed; inset: 0; display: none; flex-direction: column; align-items: center; justify-content: center;
              background: rgba(5,6,15,0.9); color: #e8ecff; text-align: center; padding: 16px; box-sizing: border-box; overflow-y: auto; }
      #menu h1 { font-size: 40px; letter-spacing: 12px; color: #ffd36a; margin: 0 0 8px; }
      #menu p { margin: 8px; color: #b8c0e8; }
      #menu .lead { max-width: 560px; }
      #menu .levels { display: grid; grid-template-columns: repeat(5, 84px); gap: 8px; margin: 14px 0; }
      #menu button { font-family: monospace; background: #151a33; color: #e8ecff; border: 1px solid #3a4270; border-radius: 4px; cursor: pointer; padding: 6px 10px; }
      #menu button:hover:not(:disabled) { border-color: #ffd36a; }
      #menu button:disabled { opacity: 0.4; cursor: default; }
      #menu .levels button { display: flex; flex-direction: column; align-items: center; gap: 2px; height: 56px; justify-content: center; }
      #menu .levels button b { font-size: 18px; }
      #menu .levels button span { color: #ffd36a; font-size: 12px; }
      #menu .levels button.current { border-color: #7fa0c8; }
      #menu input { font-family: monospace; background: #0b0e1f; color: #e8ecff; border: 1px solid #3a4270; border-radius: 4px; padding: 5px; }
      #menu .keys { color: #7f88b0; font-size: 12px; }
      @media (max-width: 500px) { #menu .levels { grid-template-columns: repeat(4, 64px); } }
      #pause { position: fixed; inset: 0; display: none; flex-direction: column; align-items: center; justify-content: center;
               background: rgba(5,6,15,0.6); color: #e8ecff; pointer-events: none; }
      #pause h1 { letter-spacing: 8px; color: #c8d0ff; margin: 0 0 8px; }
      #menu details { margin-top: 6px; max-width: 520px; }
      #menu summary { cursor: pointer; color: #c8d0ff; }
      #menu table.controls { margin: 8px auto; border-collapse: collapse; font-size: 13px; }
      #menu table.controls td { padding: 2px 8px; text-align: left; color: #b8c0e8; }
      #menu table.controls button { min-width: 72px; }
      #hud { position: fixed; left: 12px; bottom: 10px; font-size: 13px; color: #9fb0ff; pointer-events: none; text-shadow: 0 0 4px #000; }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="hud"></div>
    <div id="crosshair"></div>
    <div id="energy"></div>
    <div id="message"></div>
    <div id="taunt"></div>
    <div id="beam"></div>
    <div id="lit"></div>
    <div id="relays"></div>
    <div id="end"></div>
    <div id="pause"></div>
    <div id="menu"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
