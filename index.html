<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Vantage</title>
    <style>
      html, body { margin: 0; height: 100%; background: #000; color: #ddd; font-family: monospace; overflow: hidden; }
      #app { width: 100%; height: 100%; }
      #crosshair { position: fixed; left: 50%; top: 50%; width: 16px; height: 16px; margin: -8px 0 0 -8px; pointer-events: none; }
      #crosshair::before, #crosshair::after { content: ''; position: absolute; background: #e8ecff; box-shadow: 0 0 2px #000; }
      #crosshair::before { left: 7px; top: 0; width: 2px; height: 16px; }
      #crosshair::after { top: 7px; left: 0; height: 2px; width: 16px; }
      #hud { position: fixed; left: 12px; bottom: 10px; font-size: 13px; color: #9fb0ff; pointer-events: none; text-shadow: 0 0 4px #000; }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="hud"></div>
    <div id="crosshair"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
